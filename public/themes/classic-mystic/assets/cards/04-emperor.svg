<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <pattern id="texture4" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#6b3fa0" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.5" fill="#6b3fa0" opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="200" height="320" rx="12" fill="url(#cardBg4)"/>
  <rect width="200" height="320" rx="12" fill="url(#texture4)"/>
  <rect width="200" height="320" rx="12" fill="none" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.5" opacity="0.7"/>
  
  <g opacity="0.8" fill="#d4af37">
    <path d="M 15,15 L 20,15 L 17.5,20 Z"/>
    <path d="M 15,15 L 15,20 L 20,17.5 Z"/>
    <path d="M 185,15 L 180,15 L 182.5,20 Z"/>
    <path d="M 185,15 L 185,20 L 180,17.5 Z"/>
    <path d="M 15,305 L 20,305 L 17.5,300 Z"/>
    <path d="M 15,305 L 15,300 L 20,302.5 Z"/>
    <path d="M 185,305 L 180,305 L 182.5,300 Z"/>
    <path d="M 185,305 L 185,300 L 180,302.5 Z"/>
  </g>
  
  <path d="M 50,25 L 150,25 L 155,35 L 150,45 L 50,45 L 45,35 Z" fill="#6b3fa0" opacity="0.15"/>
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">IV</text>
  <text x="100" y="58" text-anchor="middle" font-family="serif" font-size="13" fill="#6b3fa0" font-weight="600">THE EMPEROR</text>
  
  <g transform="translate(100, 160)">
    <!-- Radiant power aura -->
    <g opacity="0.25" stroke="#d4af37" stroke-width="1.5">
      <line x1="-55" y1="-45" x2="-65" y2="-55"/>
      <line x1="0" y1="-60" x2="0" y2="-70"/>
      <line x1="55" y1="-45" x2="65" y2="-55"/>
      <line x1="-65" y1="0" x2="-75" y2="0"/>
      <line x1="65" y1="0" x2="75" y2="0"/>
    </g>
    
    <!-- Mountain background -->
    <g opacity="0.2">
      <path d="M -70,-20 L -55,-50 L -40,-20" fill="#6b3fa0" stroke="#6b3fa0" stroke-width="1"/>
      <path d="M -50,-10 L -35,-45 L -20,-10" fill="#6b3fa0" stroke="#6b3fa0" stroke-width="1"/>
      <path d="M 20,-10 L 35,-45 L 50,-10" fill="#6b3fa0" stroke="#6b3fa0" stroke-width="1"/>
      <path d="M 40,-20 L 55,-50 L 70,-20" fill="#6b3fa0" stroke="#6b3fa0" stroke-width="1"/>
    </g>
    
    <!-- Ram throne heads -->
    <g transform="translate(-40, -25)">
      <circle cx="0" cy="0" r="8" fill="#6b3fa0" opacity="0.6"/>
      <path d="M -10,-5 Q -12,-10 -8,-12 Q -6,-8 -4,-10" stroke="#6b3fa0" stroke-width="2" fill="none"/>
      <path d="M 10,-5 Q 12,-10 8,-12 Q 6,-8 4,-10" stroke="#6b3fa0" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(40, -25)">
      <circle cx="0" cy="0" r="8" fill="#6b3fa0" opacity="0.6"/>
      <path d="M -10,-5 Q -12,-10 -8,-12 Q -6,-8 -4,-10" stroke="#6b3fa0" stroke-width="2" fill="none"/>
      <path d="M 10,-5 Q 12,-10 8,-12 Q 6,-8 4,-10" stroke="#6b3fa0" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Throne -->
    <g>
      <rect x="-45" y="-20" width="90" height="70" fill="#6b3fa0" opacity="0.3" stroke="#6b3fa0" stroke-width="2"/>
      <rect x="-50" y="-25" width="100" height="10" fill="#6b3fa0" opacity="0.5" stroke="#6b3fa0" stroke-width="1.5"/>
      <line x1="-45" y1="-20" x2="-45" y2="-55" stroke="#6b3fa0" stroke-width="4"/>
      <line x1="45" y1="-20" x2="45" y2="-55" stroke="#6b3fa0" stroke-width="4"/>
      <circle cx="-45" cy="-55" r="5" fill="#d4af37"/>
      <circle cx="45" cy="-55" r="5" fill="#d4af37"/>
      
      <!-- Decorative throne details -->
      <g opacity="0.5">
        <rect x="-40" y="-10" width="15" height="15" fill="none" stroke="#d4af37" stroke-width="1"/>
        <rect x="25" y="-10" width="15" height="15" fill="none" stroke="#d4af37" stroke-width="1"/>
        <rect x="-40" y="15" width="15" height="15" fill="none" stroke="#d4af37" stroke-width="1"/>
        <rect x="25" y="15" width="15" height="15" fill="none" stroke="#d4af37" stroke-width="1"/>
      </g>
    </g>
    
    <!-- Emperor figure -->
    <g>
      <!-- Head with crown -->
      <circle cx="0" cy="-35" r="11" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="2"/>
      <circle cx="-3" cy="-36" r="1.5" fill="#6b3fa0"/>
      <circle cx="3" cy="-36" r="1.5" fill="#6b3fa0"/>
      <path d="M -2,-32 L 2,-32" stroke="#6b3fa0" stroke-width="1.5"/>
      
      <!-- Crown -->
      <path d="M -15,-48 L -12,-44 L -6,-46 L 0,-43 L 6,-46 L 12,-44 L 15,-48 L 15,-50 L -15,-50 Z" 
            fill="#d4af37" stroke="#d4af37" stroke-width="1.5"/>
      <circle cx="-10" cy="-47" r="2" fill="#c41e3a"/>
      <circle cx="0" cy="-45" r="2" fill="#c41e3a"/>
      <circle cx="10" cy="-47" r="2" fill="#c41e3a"/>
      
      <!-- Red robe with armor -->
      <path d="M -16,-24 L -20,15 L -22,35 L 22,35 L 20,15 L 16,-24 Z" 
            fill="#c41e3a" opacity="0.7" stroke="#6b3fa0" stroke-width="2"/>
      
      <!-- Armor chest plate -->
      <rect x="-12" y="-20" width="24" height="25" rx="2" fill="#6b3fa0" opacity="0.4" stroke="#d4af37" stroke-width="1.5"/>
      <circle cx="0" cy="-10" r="3" fill="#d4af37"/>
      <circle cx="-6" cy="-2" r="2" fill="#d4af37" opacity="0.6"/>
      <circle cx="6" cy="-2" r="2" fill="#d4af37" opacity="0.6"/>
      
      <!-- Ankh scepter in right hand -->
      <g transform="translate(25, -5)">
        <circle cx="0" cy="-8" r="6" fill="none" stroke="#d4af37" stroke-width="2.5"/>
        <line x1="0" y1="-2" x2="0" y2="30" stroke="#d4af37" stroke-width="2.5"/>
        <line x1="-5" y1="8" x2="5" y2="8" stroke="#d4af37" stroke-width="2.5"/>
        <circle cx="0" cy="32" r="3" fill="#d4af37"/>
      </g>
      
      <!-- Orb in left hand -->
      <g transform="translate(-22, 5)">
        <circle cx="0" cy="0" r="7" fill="#d4af37" opacity="0.6" stroke="#d4af37" stroke-width="2"/>
        <path d="M 0,-7 L 0,7 M -7,0 L 7,0" stroke="#6b3fa0" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="3" fill="none" stroke="#6b3fa0" stroke-width="1"/>
      </g>
    </g>
    
    <!-- Ram symbols at base -->
    <g transform="translate(0, 55)" opacity="0.5">
      <path d="M -15,0 Q -18,-5 -15,-8 Q -12,-5 -10,-8" stroke="#d4af37" stroke-width="2" fill="none"/>
      <path d="M 15,0 Q 18,-5 15,-8 Q 12,-5 10,-8" stroke="#d4af37" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Decorative elements -->
    <g fill="#d4af37" opacity="0.5">
      <circle cx="-60" cy="-30" r="2"/>
      <circle cx="60" cy="-30" r="2"/>
      <circle cx="-55" cy="40" r="2"/>
      <circle cx="55" cy="40" r="2"/>
    </g>
  </g>
  
  <path d="M 30,285 L 35,280 L 165,280 L 170,285 L 170,295 L 165,300 L 35,300 L 30,295 Z" 
        fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="293" text-anchor="middle" font-family="serif" font-size="10" fill="#6b3fa0" opacity="0.85">
    Authority · Structure · Control
  </text>
</svg>

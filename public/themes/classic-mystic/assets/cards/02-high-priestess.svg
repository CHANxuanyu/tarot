<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <pattern id="texture2" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#6b3fa0" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.5" fill="#6b3fa0" opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="200" height="320" rx="12" fill="url(#cardBg2)"/>
  <rect width="200" height="320" rx="12" fill="url(#texture2)"/>
  <rect width="200" height="320" rx="12" fill="none" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.5" opacity="0.7"/>
  
  <g opacity="0.8" fill="#d4af37">
    <path d="M 15,15 L 20,15 L 17.5,20 Z"/>
    <path d="M 15,15 L 15,20 L 20,17.5 Z"/>
    <path d="M 185,15 L 180,15 L 182.5,20 Z"/>
    <path d="M 185,15 L 185,20 L 180,17.5 Z"/>
    <path d="M 15,305 L 20,305 L 17.5,300 Z"/>
    <path d="M 15,305 L 15,300 L 20,302.5 Z"/>
    <path d="M 185,305 L 180,305 L 182.5,300 Z"/>
    <path d="M 185,305 L 185,300 L 180,302.5 Z"/>
  </g>
  
  <path d="M 40,25 L 160,25 L 165,35 L 160,45 L 40,45 L 35,35 Z" fill="#6b3fa0" opacity="0.15"/>
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">II</text>
  <text x="100" y="58" text-anchor="middle" font-family="serif" font-size="12" fill="#6b3fa0" font-weight="600">THE HIGH PRIESTESS</text>
  
  <g transform="translate(100, 160)">
    <!-- Moon halo -->
    <g opacity="0.3" stroke="#d4af37" stroke-width="1.5">
      <circle cx="0" cy="-45" r="35" fill="none"/>
      <circle cx="0" cy="-45" r="28" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Crescent moon crown -->
    <g transform="translate(0, -65)">
      <path d="M -8,-5 Q -12,-10 -10,-15 Q -8,-12 -8,-8 Q -6,-12 -4,-15 Q -6,-10 -8,-5" 
            fill="#d4af37" opacity="0.8"/>
      <path d="M 8,-5 Q 12,-10 10,-15 Q 8,-12 8,-8 Q 6,-12 4,-15 Q 6,-10 8,-5" 
            fill="#d4af37" opacity="0.8"/>
      <circle cx="0" cy="-8" r="6" fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M -4,-8 Q 0,-12 4,-8" fill="#d4af37" opacity="0.7"/>
    </g>
    
    <!-- Two pillars: B and J -->
    <!-- Black pillar (B) -->
    <g transform="translate(-45, 0)">
      <rect x="-8" y="-40" width="16" height="90" fill="#2c2c2c" stroke="#6b3fa0" stroke-width="1.5"/>
      <rect x="-10" y="-42" width="20" height="8" fill="#2c2c2c" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="0" cy="-46" r="6" fill="#2c2c2c" stroke="#6b3fa0" stroke-width="1.5"/>
      <text x="0" y="-20" text-anchor="middle" font-family="serif" font-size="18" fill="#d4af37" font-weight="bold">B</text>
      <line x1="-6" y1="-35" x2="-6" y2="45" stroke="#6b3fa0" stroke-width="0.5" opacity="0.3"/>
      <line x1="6" y1="-35" x2="6" y2="45" stroke="#6b3fa0" stroke-width="0.5" opacity="0.3"/>
    </g>
    
    <!-- White pillar (J) -->
    <g transform="translate(45, 0)">
      <rect x="-8" y="-40" width="16" height="90" fill="#f5f5f5" stroke="#6b3fa0" stroke-width="1.5"/>
      <rect x="-10" y="-42" width="20" height="8" fill="#f5f5f5" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="0" cy="-46" r="6" fill="#f5f5f5" stroke="#6b3fa0" stroke-width="1.5"/>
      <text x="0" y="-20" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">J</text>
      <line x1="-6" y1="-35" x2="-6" y2="45" stroke="#6b3fa0" stroke-width="0.5" opacity="0.3"/>
      <line x1="6" y1="-35" x2="6" y2="45" stroke="#6b3fa0" stroke-width="0.5" opacity="0.3"/>
    </g>
    
    <!-- Veil with pomegranates -->
    <g opacity="0.6">
      <rect x="-45" y="-40" width="90" height="70" fill="#4169e1" opacity="0.2"/>
      <path d="M -40,-35 Q -35,-30 -40,-25 M -30,-38 Q -25,-33 -30,-28 M -20,-35 Q -15,-30 -20,-25
               M -10,-38 Q -5,-33 -10,-28 M 0,-35 Q 5,-30 0,-25 M 10,-38 Q 15,-33 10,-28
               M 20,-35 Q 25,-30 20,-25 M 30,-38 Q 35,-33 30,-28 M 40,-35 Q 45,-30 40,-25" 
            stroke="#d4af37" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- Pomegranates -->
      <g fill="#c41e3a" opacity="0.6">
        <circle cx="-35" cy="-15" r="4"/>
        <circle cx="-15" cy="-18" r="3.5"/>
        <circle cx="5" cy="-15" r="4"/>
        <circle cx="25" cy="-18" r="3.5"/>
        <circle cx="-25" cy="0" r="3.5"/>
        <circle cx="0" cy="2" r="4"/>
        <circle cx="30" cy="0" r="3.5"/>
        <circle cx="-35" cy="15" r="3.5"/>
        <circle cx="15" cy="18" r="4"/>
      </g>
    </g>
    
    <!-- High Priestess seated figure -->
    <g>
      <!-- Head -->
      <circle cx="0" cy="-42" r="11" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="2"/>
      <circle cx="-3" cy="-43" r="1.5" fill="#6b3fa0"/>
      <circle cx="3" cy="-43" r="1.5" fill="#6b3fa0"/>
      <path d="M -2,-39 Q 0,-37 2,-39" stroke="#6b3fa0" stroke-width="1" fill="none"/>
      
      <!-- Blue robe -->
      <path d="M -14,-31 L -22,10 L -25,35 L 25,35 L 22,10 L 14,-31 Z" 
            fill="#4169e1" opacity="0.7" stroke="#6b3fa0" stroke-width="1.5"/>
      
      <!-- White inner garment -->
      <path d="M -10,-31 L 10,-31 L 8,10 L -8,10 Z" fill="#ffffff" opacity="0.5"/>
      <path d="M 0,-31 L 0,10" stroke="#6b3fa0" stroke-width="0.8" opacity="0.4"/>
      
      <!-- Cross on chest -->
      <g transform="translate(0, -15)" stroke="#d4af37" stroke-width="2">
        <line x1="0" y1="-6" x2="0" y2="6"/>
        <line x1="-4" y1="0" x2="4" y2="0"/>
        <circle cx="0" cy="0" r="2" fill="none" stroke-width="1"/>
      </g>
      
      <!-- Scroll/Torah in lap -->
      <g transform="translate(0, 15)">
        <rect x="-12" y="-4" width="24" height="10" rx="2" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="1.5"/>
        <circle cx="-10" cy="1" r="3" fill="none" stroke="#6b3fa0" stroke-width="1"/>
        <circle cx="10" cy="1" r="3" fill="none" stroke="#6b3fa0" stroke-width="1"/>
        <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#6b3fa0" stroke-width="0.5"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#6b3fa0" stroke-width="0.5"/>
        <line x1="-8" y1="2" x2="8" y2="2" stroke="#6b3fa0" stroke-width="0.5"/>
        <text x="0" y="2" text-anchor="middle" font-family="serif" font-size="6" fill="#6b3fa0">TORA</text>
      </g>
    </g>
    
    <!-- Water/pool at base -->
    <g transform="translate(0, 55)">
      <ellipse cx="0" cy="0" rx="55" ry="8" fill="#4169e1" opacity="0.2" stroke="#6b3fa0" stroke-width="1"/>
      <path d="M -50,0 Q -40,-2 -30,0 Q -20,-2 -10,0 Q 0,-2 10,0 Q 20,-2 30,0 Q 40,-2 50,0" 
            stroke="#6b3fa0" stroke-width="1" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Decorative stars -->
    <g fill="#d4af37" opacity="0.6">
      <path d="M -65,-40 L -63,-42 L -61,-40 L -63,-38 Z"/>
      <path d="M 65,-40 L 67,-42 L 69,-40 L 67,-38 Z"/>
      <path d="M -60,30 L -58,28 L -56,30 L -58,32 Z"/>
      <path d="M 60,30 L 62,28 L 64,30 L 62,32 Z"/>
    </g>
  </g>
  
  <path d="M 30,285 L 35,280 L 165,280 L 170,285 L 170,295 L 165,300 L 35,300 L 30,295 Z" 
        fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="293" text-anchor="middle" font-family="serif" font-size="10" fill="#6b3fa0" opacity="0.85">
    Intuition · Mystery · Divine Feminine
  </text>
</svg>

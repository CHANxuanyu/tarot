<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <pattern id="texture1" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#6b3fa0" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.5" fill="#6b3fa0" opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="200" height="320" rx="12" fill="url(#cardBg1)"/>
  <rect width="200" height="320" rx="12" fill="url(#texture1)"/>
  <rect width="200" height="320" rx="12" fill="none" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.5" opacity="0.7"/>
  
  <g opacity="0.8" fill="#d4af37">
    <path d="M 15,15 L 20,15 L 17.5,20 Z"/>
    <path d="M 15,15 L 15,20 L 20,17.5 Z"/>
    <path d="M 185,15 L 180,15 L 182.5,20 Z"/>
    <path d="M 185,15 L 185,20 L 180,17.5 Z"/>
    <path d="M 15,305 L 20,305 L 17.5,300 Z"/>
    <path d="M 15,305 L 15,300 L 20,302.5 Z"/>
    <path d="M 185,305 L 180,305 L 182.5,300 Z"/>
    <path d="M 185,305 L 185,300 L 180,302.5 Z"/>
  </g>
  
  <path d="M 50,25 L 150,25 L 155,35 L 150,45 L 50,45 L 45,35 Z" fill="#6b3fa0" opacity="0.15"/>
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">I</text>
  <text x="100" y="58" text-anchor="middle" font-family="serif" font-size="13" fill="#6b3fa0" font-weight="600">THE MAGICIAN</text>
  
  <g transform="translate(100, 140)">
    <!-- Radiant energy -->
    <g opacity="0.25" stroke="#d4af37" stroke-width="1.5">
      <line x1="-50" y1="-40" x2="-58" y2="-48"/>
      <line x1="-35" y1="-50" x2="-40" y2="-60"/>
      <line x1="0" y1="-55" x2="0" y2="-65"/>
      <line x1="35" y1="-50" x2="40" y2="-60"/>
      <line x1="50" y1="-40" x2="58" y2="-48"/>
      <line x1="-60" y1="0" x2="-70" y2="0"/>
      <line x1="60" y1="0" x2="70" y2="0"/>
    </g>
    
    <!-- Infinity symbol above head -->
    <g transform="translate(0, -50)">
      <path d="M -15,0 Q -10,-8 0,-4 Q 10,-8 15,0 Q 10,8 0,4 Q -10,8 -15,0 Z" 
            fill="none" stroke="#d4af37" stroke-width="2.5" opacity="0.9"/>
      <path d="M -12,0 Q -8,-5 0,-2 Q 8,-5 12,0 Q 8,5 0,2 Q -8,5 -12,0 Z" 
            fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
    </g>
    
    <!-- Magician figure -->
    <g>
      <!-- Head -->
      <circle cx="0" cy="-25" r="10" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="2"/>
      <circle cx="-3" cy="-26" r="1.5" fill="#6b3fa0"/>
      <circle cx="3" cy="-26" r="1.5" fill="#6b3fa0"/>
      
      <!-- Red robe -->
      <path d="M -12,-15 L -18,25 L -20,45 L 20,45 L 18,25 L 12,-15 Z" 
            fill="#c41e3a" opacity="0.7" stroke="#6b3fa0" stroke-width="1.5"/>
      <path d="M -8,-15 L 8,-15 L 6,15 L -6,15 Z" fill="#ffffff" opacity="0.3"/>
      
      <!-- White outer robe -->
      <path d="M -18,25 Q -25,30 -28,45 L -20,45" fill="#ffffff" opacity="0.6" stroke="#6b3fa0" stroke-width="1"/>
      <path d="M 18,25 Q 25,30 28,45 L 20,45" fill="#ffffff" opacity="0.6" stroke="#6b3fa0" stroke-width="1"/>
      
      <!-- Right arm raised with wand -->
      <line x1="12" y1="-10" x2="18" y2="-42" stroke="#f4e4bc" stroke-width="3.5"/>
      <line x1="18" y1="-42" x2="18" y2="-55" stroke="#6b3fa0" stroke-width="3"/>
      <circle cx="18" cy="-57" r="4" fill="#d4af37" stroke="#d4af37" stroke-width="2"/>
      <circle cx="18" cy="-57" r="2" fill="#ffffff"/>
      
      <!-- Left arm pointing down -->
      <line x1="-12" y1="-10" x2="-18" y2="15" stroke="#f4e4bc" stroke-width="3.5"/>
      <line x1="-18" y1="15" x2="-18" y2="25" stroke="#f4e4bc" stroke-width="2.5"/>
    </g>
    
    <!-- Altar table -->
    <g transform="translate(0, 50)">
      <rect x="-35" y="0" width="70" height="8" fill="#6b3fa0" opacity="0.5" stroke="#6b3fa0" stroke-width="1.5"/>
      <path d="M -35,8 L -30,25 L 30,25 L 35,8 Z" fill="#6b3fa0" opacity="0.3" stroke="#6b3fa0" stroke-width="1.5"/>
      
      <!-- Four suit symbols on altar -->
      <!-- Pentacle (earth) -->
      <g transform="translate(-22, 15)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#d4af37" stroke-width="1.5"/>
        <path d="M 0,-6 L -1.8,2 L 5.7,-2.3 L -5.7,-2.3 L 1.8,2 Z" fill="none" stroke="#d4af37" stroke-width="1.5"/>
      </g>
      
      <!-- Cup (water) -->
      <g transform="translate(-7, 15)">
        <path d="M -4,0 L -3,-6 L 3,-6 L 4,0 Q 4,4 0,5 Q -4,4 -4,0 Z" 
              fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#6b3fa0" stroke-width="1"/>
      </g>
      
      <!-- Sword (air) -->
      <g transform="translate(7, 15)">
        <line x1="0" y1="-6" x2="0" y2="3" stroke="#6b3fa0" stroke-width="1.5"/>
        <path d="M -3,3 L -3,5 L 3,5 L 3,3 Z" fill="#6b3fa0"/>
        <line x1="-4" y1="3" x2="4" y2="3" stroke="#6b3fa0" stroke-width="1.5"/>
      </g>
      
      <!-- Wand (fire) -->
      <g transform="translate(22, 15)">
        <rect x="-1" y="-6" width="2" height="11" fill="#d4af37"/>
        <path d="M 0,-8 L -2,-6 L 2,-6 Z" fill="#d4af37"/>
        <circle cx="0" cy="-8" r="1.5" fill="#d4af37"/>
      </g>
    </g>
    
    <!-- Garden flowers at base -->
    <g transform="translate(0, 75)" opacity="0.7">
      <ellipse cx="-40" cy="0" rx="8" ry="3" fill="#d4af37" opacity="0.4"/>
      <path d="M -45,0 Q -45,-5 -40,-6 Q -35,-5 -35,0" fill="#d4af37" opacity="0.5"/>
      <ellipse cx="40" cy="0" rx="8" ry="3" fill="#d4af37" opacity="0.4"/>
      <path d="M 35,0 Q 35,-5 40,-6 Q 45,-5 45,0" fill="#d4af37" opacity="0.5"/>
      
      <path d="M -30,0 L -30,-4 L -28,-4 L -28,0" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="-29" cy="-5" r="2" fill="#6b3fa0" opacity="0.6"/>
      <path d="M 30,0 L 30,-4 L 32,-4 L 32,0" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="31" cy="-5" r="2" fill="#6b3fa0" opacity="0.6"/>
    </g>
    
    <!-- Decorative stars -->
    <g fill="#d4af37" opacity="0.5">
      <path d="M -60,-30 L -58,-32 L -56,-30 L -58,-28 Z"/>
      <path d="M 60,-30 L 62,-32 L 64,-30 L 62,-28 Z"/>
      <path d="M -45,60 L -43,58 L -41,60 L -43,62 Z"/>
      <path d="M 45,60 L 47,58 L 49,60 L 47,62 Z"/>
    </g>
  </g>
  
  <path d="M 30,285 L 35,280 L 165,280 L 170,285 L 170,295 L 165,300 L 35,300 L 30,295 Z" 
        fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="293" text-anchor="middle" font-family="serif" font-size="10" fill="#6b3fa0" opacity="0.85">
    Manifestation · Power · Action
  </text>
</svg>

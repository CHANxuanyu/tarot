<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg7)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <!-- Roman numeral + name at top -->
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">VII - THE CHARIOT</text>
  <!-- Central symbol: chariot wheel with star above -->
  <g transform="translate(100, 160)">
    <!-- Star above -->
    <polygon points="0,-55 -4,-43 -16,-43 -6,-35 -10,-23 0,-31 10,-23 6,-35 16,-43 4,-43" 
             fill="none" stroke="#d4af37" stroke-width="2"/>
    <circle cx="0" cy="-39" r="3" fill="#d4af37"/>
    <!-- Chariot wheel -->
    <circle cx="0" cy="10" r="35" fill="none" stroke="#6b3fa0" stroke-width="3"/>
    <circle cx="0" cy="10" r="6" fill="#6b3fa0"/>
    <!-- Spokes -->
    <line x1="0" y1="10" x2="0" y2="-25" stroke="#6b3fa0" stroke-width="2"/>
    <line x1="0" y1="10" x2="30" y2="-7" stroke="#6b3fa0" stroke-width="2"/>
    <line x1="0" y1="10" x2="30" y2="27" stroke="#6b3fa0" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="45" stroke="#6b3fa0" stroke-width="2"/>
    <line x1="0" y1="10" x2="-30" y2="27" stroke="#6b3fa0" stroke-width="2"/>
    <line x1="0" y1="10" x2="-30" y2="-7" stroke="#6b3fa0" stroke-width="2"/>
    <!-- Decorative rim -->
    <circle cx="0" cy="10" r="28" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Keywords at bottom -->
  <text x="100" y="300" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Control · Willpower · Success</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <pattern id="texture0" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#6b3fa0" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.5" fill="#6b3fa0" opacity="0.05"/>
    </pattern>
    <radialGradient id="sunGrad0" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.6"/>
    </radialGradient>
  </defs>
  
  <!-- Background with texture -->
  <rect width="200" height="320" rx="12" fill="url(#cardBg0)"/>
  <rect width="200" height="320" rx="12" fill="url(#texture0)"/>
  
  <!-- Double border: outer gold -->
  <rect width="200" height="320" rx="12" fill="none" stroke="#d4af37" stroke-width="2"/>
  <!-- Inner decorative purple border -->
  <rect x="8" y="8" width="184" height="304" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Corner ornaments -->
  <g opacity="0.8" fill="#d4af37">
    <path d="M 15,15 L 20,15 L 17.5,20 Z"/>
    <path d="M 15,15 L 15,20 L 20,17.5 Z"/>
    <path d="M 185,15 L 180,15 L 182.5,20 Z"/>
    <path d="M 185,15 L 185,20 L 180,17.5 Z"/>
    <path d="M 15,305 L 20,305 L 17.5,300 Z"/>
    <path d="M 15,305 L 15,300 L 20,302.5 Z"/>
    <path d="M 185,305 L 180,305 L 182.5,300 Z"/>
    <path d="M 185,305 L 185,300 L 180,302.5 Z"/>
  </g>
  
  <!-- Header banner -->
  <path d="M 50,25 L 150,25 L 155,35 L 150,45 L 50,45 L 45,35 Z" fill="#6b3fa0" opacity="0.15"/>
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">0</text>
  <text x="100" y="58" text-anchor="middle" font-family="serif" font-size="13" fill="#6b3fa0" font-weight="600">THE FOOL</text>
  
  <!-- Central illustration -->
  <g transform="translate(100, 160)">
    <!-- Radiant halo behind figure -->
    <g opacity="0.3">
      <line x1="-40" y1="-50" x2="-45" y2="-55" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="-30" y1="-55" x2="-32" y2="-62" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="-15" y1="-58" x2="-15" y2="-65" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="0" y1="-60" x2="0" y2="-68" stroke="#d4af37" stroke-width="2"/>
      <line x1="15" y1="-58" x2="15" y2="-65" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="30" y1="-55" x2="32" y2="-62" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="40" y1="-50" x2="45" y2="-55" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="-45" y1="-35" x2="-52" y2="-38" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="45" y1="-35" x2="52" y2="-38" stroke="#d4af37" stroke-width="1.5"/>
    </g>
    
    <!-- Sun with detailed rays -->
    <circle cx="35" cy="-45" r="22" fill="url(#sunGrad0)"/>
    <circle cx="35" cy="-45" r="18" fill="#ffd700" opacity="0.8"/>
    <g stroke="#d4af37" stroke-width="2" fill="none">
      <line x1="35" y1="-70" x2="35" y2="-67"/>
      <line x1="35" y1="-23" x2="35" y2="-20"/>
      <line x1="10" y1="-45" x2="13" y2="-45"/>
      <line x1="57" y1="-45" x2="60" y2="-45"/>
      <line x1="16" y1="-66" x2="18" y2="-64"/>
      <line x1="52" y1="-26" x2="54" y2="-24"/>
      <line x1="54" y1="-66" x2="52" y2="-64"/>
      <line x1="18" y1="-26" x2="16" y2="-24"/>
    </g>
    <circle cx="35" cy="-45" r="12" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    
    <!-- Mountain/cliff with detail -->
    <path d="M -60,45 L -50,20 L -40,30 L -30,15 L -20,25 L -8,35 L -8,55 L -60,55 Z" 
          fill="#6b3fa0" opacity="0.2" stroke="#6b3fa0" stroke-width="1"/>
    <line x1="-60" y1="45" x2="-8" y2="45" stroke="#6b3fa0" stroke-width="2.5"/>
    <line x1="-8" y1="45" x2="-8" y2="60" stroke="#6b3fa0" stroke-width="2"/>
    
    <!-- Flowers on cliff -->
    <g fill="#d4af37" opacity="0.7">
      <circle cx="-45" cy="42" r="2"/>
      <path d="M -45,42 L -46,38 L -45,36 L -44,38 Z"/>
      <circle cx="-30" cy="42" r="2"/>
      <path d="M -30,42 L -31,38 L -30,36 L -29,38 Z"/>
      <circle cx="-20" cy="42" r="2"/>
      <path d="M -20,42 L -21,38 L -20,36 L -19,38 Z"/>
    </g>
    
    <!-- Fool figure with detail -->
    <g transform="translate(-28, -10)">
      <!-- Head with hat -->
      <circle cx="0" cy="-15" r="9" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="2"/>
      <path d="M -9,-15 Q -12,-25 -8,-28 L -5,-26 L -2,-30 L 0,-26 L 3,-30 L 6,-26 L 9,-28 Q 13,-25 9,-15" 
            fill="#d4af37" stroke="#d4af37" stroke-width="1"/>
      <circle cx="-3" cy="-16" r="1.5" fill="#6b3fa0"/>
      <circle cx="3" cy="-16" r="1.5" fill="#6b3fa0"/>
      <path d="M -2,-12 Q 0,-10 2,-12" stroke="#6b3fa0" stroke-width="1" fill="none"/>
      
      <!-- Body with decorative tunic -->
      <path d="M -7,-6 L -10,18 L -12,30 L 12,30 L 10,18 L 7,-6 Z" 
            fill="#6b3fa0" opacity="0.6" stroke="#6b3fa0" stroke-width="1.5"/>
      <path d="M -5,-6 L 5,-6 L 4,10 L -4,10 Z" fill="#d4af37" opacity="0.5"/>
      <circle cx="0" cy="0" r="2" fill="#d4af37"/>
      <circle cx="0" cy="6" r="2" fill="#d4af37"/>
      
      <!-- Arms with staff -->
      <line x1="-7" y1="0" x2="-18" y2="-8" stroke="#f4e4bc" stroke-width="3"/>
      <line x1="-18" y1="-8" x2="-20" y2="10" stroke="#6b3fa0" stroke-width="2.5"/>
      <circle cx="-20" cy="12" r="3" fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M -22,10 L -20,8 L -18,10" fill="#d4af37"/>
      <line x1="7" y1="0" x2="16" y2="-5" stroke="#f4e4bc" stroke-width="3"/>
      
      <!-- Legs -->
      <line x1="-8" y1="30" x2="-10" y2="48" stroke="#f4e4bc" stroke-width="3"/>
      <line x1="8" y1="30" x2="15" y2="48" stroke="#f4e4bc" stroke-width="3"/>
      <path d="M -12,48 L -8,48 L -9,52 L -11,52 Z" fill="#6b3fa0"/>
      <path d="M 13,48 L 17,48 L 16,52 L 14,52 Z" fill="#6b3fa0"/>
    </g>
    
    <!-- White dog companion -->
    <g transform="translate(-42, 20)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#ffffff" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="-3" cy="0" r="4" fill="#ffffff" stroke="#6b3fa0" stroke-width="1"/>
      <circle cx="-5" cy="-2" r="1.5" fill="#6b3fa0"/>
      <line x1="-6" y1="-5" x2="-7" y2="-8" stroke="#6b3fa0" stroke-width="1.5"/>
      <line x1="-4" y1="-5" x2="-4" y2="-8" stroke="#6b3fa0" stroke-width="1.5"/>
      <line x1="6" y1="3" x2="10" y2="4" stroke="#6b3fa0" stroke-width="1.5"/>
    </g>
    
    <!-- Butterflies -->
    <g transform="translate(20, -25)" opacity="0.8">
      <ellipse cx="-2" cy="0" rx="4" ry="3" fill="#d4af37" opacity="0.6"/>
      <ellipse cx="2" cy="0" rx="4" ry="3" fill="#d4af37" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#6b3fa0"/>
      <path d="M -4,-2 Q -5,-4 -3,-4" stroke="#6b3fa0" stroke-width="0.5" fill="none"/>
      <path d="M 4,-2 Q 5,-4 3,-4" stroke="#6b3fa0" stroke-width="0.5" fill="none"/>
    </g>
    <g transform="translate(40, -10)" opacity="0.7">
      <ellipse cx="-1.5" cy="0" rx="3" ry="2.5" fill="#6b3fa0" opacity="0.4"/>
      <ellipse cx="1.5" cy="0" rx="3" ry="2.5" fill="#6b3fa0" opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#6b3fa0"/>
    </g>
    
    <!-- Decorative stars -->
    <g fill="#d4af37" opacity="0.6">
      <path d="M -55,-20 L -54,-22 L -53,-20 L -55,-19 Z"/>
      <path d="M 55,-30 L 56,-32 L 57,-30 L 55,-29 Z"/>
      <path d="M -50,50 L -49,48 L -48,50 L -50,51 Z"/>
      <path d="M 50,30 L 51,28 L 52,30 L 50,31 Z"/>
    </g>
  </g>
  
  <!-- Footer cartouche -->
  <path d="M 30,285 L 35,280 L 165,280 L 170,285 L 170,295 L 165,300 L 35,300 L 30,295 Z" 
        fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="293" text-anchor="middle" font-family="serif" font-size="10" fill="#6b3fa0" opacity="0.85">
    Beginnings · Innocence · Spontaneity
  </text>
</svg>

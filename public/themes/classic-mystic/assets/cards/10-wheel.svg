<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">X - WHEEL OF FORTUNE</text>
  
  <!-- Outer wheel -->
  <circle cx="100" cy="160" r="40" fill="none" stroke="#d4af37" stroke-width="3"/>
  <circle cx="100" cy="160" r="8" fill="#6b3fa0"/>
  
  <!-- Four spokes -->
  <line x1="100" y1="120" x2="100" y2="200" stroke="#6b3fa0" stroke-width="2.5"/>
  <line x1="60" y1="160" x2="140" y2="160" stroke="#6b3fa0" stroke-width="2.5"/>
  
  <!-- Directional arrows at cardinal points -->
  <path d="M 100 115 L 95 122 M 100 115 L 105 122" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 145 160 L 138 155 M 145 160 L 138 165" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 205 L 95 198 M 100 205 L 105 198" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 55 160 L 62 155 M 55 160 L 62 165" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative symbols at wheel edge -->
  <circle cx="100" cy="120" r="4" fill="#6b3fa0"/>
  <circle cx="140" cy="160" r="4" fill="#6b3fa0"/>
  <circle cx="100" cy="200" r="4" fill="#6b3fa0"/>
  <circle cx="60" cy="160" r="4" fill="#6b3fa0"/>
  
  <text x="100" y="300" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Good Luck · Karma · Cycles</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">XVIII - THE MOON</text>
  
  <!-- Crescent Moon -->
  <g transform="translate(100, 100)">
    <path d="M 0,-30 A 30,30 0 0,1 0,30 A 25,25 0 0,0 0,-30 Z" 
          fill="none" stroke="#6b3fa0" stroke-width="2.5"/>
    <circle cx="-8" cy="-10" r="2" fill="#6b3fa0"/>
    <circle cx="-10" cy="5" r="1.5" fill="#6b3fa0"/>
    
    <!-- Moon Face -->
    <path d="M -15,-8 Q -12,-10 -10,-8" stroke="#6b3fa0" stroke-width="1" fill="none"/>
    <path d="M -15,2 Q -12,0 -10,2" stroke="#6b3fa0" stroke-width="1" fill="none"/>
    <path d="M -15,8 Q -12,10 -10,8" stroke="#6b3fa0" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Two Towers -->
  <g transform="translate(100, 180)">
    <rect x="-60" y="0" width="20" height="50" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    <rect x="-58" y="-8" width="16" height="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    <rect x="-55" y="10" width="5" height="8" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    
    <rect x="40" y="0" width="20" height="50" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    <rect x="42" y="-8" width="16" height="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    <rect x="48" y="10" width="5" height="8" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    
    <!-- Winding Path -->
    <path d="M -40,50 Q -20,40 0,50 Q 20,60 40,50" 
          fill="none" stroke="#6b3fa0" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Drops/Tears -->
    <g opacity="0.5">
      <path d="M -25,-50 L -25,-40 Q -25,-35 -22,-35 Q -25,-35 -25,-30" stroke="#6b3fa0" stroke-width="1" fill="none"/>
      <path d="M 0,-45 L 0,-35 Q 0,-30 3,-30 Q 0,-30 0,-25" stroke="#6b3fa0" stroke-width="1" fill="none"/>
      <path d="M 25,-50 L 25,-40 Q 25,-35 28,-35 Q 25,-35 25,-30" stroke="#6b3fa0" stroke-width="1" fill="none"/>
    </g>
  </g>
  
  <text x="100" y="295" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Illusion · Fear</text>
  <text x="100" y="307" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Subconscious</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
    <pattern id="texture5" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#6b3fa0" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.5" fill="#6b3fa0" opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="200" height="320" rx="12" fill="url(#cardBg5)"/>
  <rect width="200" height="320" rx="12" fill="url(#texture5)"/>
  <rect width="200" height="320" rx="12" fill="none" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="10" fill="none" stroke="#6b3fa0" stroke-width="1.5" opacity="0.7"/>
  
  <g opacity="0.8" fill="#d4af37">
    <path d="M 15,15 L 20,15 L 17.5,20 Z"/>
    <path d="M 15,15 L 15,20 L 20,17.5 Z"/>
    <path d="M 185,15 L 180,15 L 182.5,20 Z"/>
    <path d="M 185,15 L 185,20 L 180,17.5 Z"/>
    <path d="M 15,305 L 20,305 L 17.5,300 Z"/>
    <path d="M 15,305 L 15,300 L 20,302.5 Z"/>
    <path d="M 185,305 L 180,305 L 182.5,300 Z"/>
    <path d="M 185,305 L 185,300 L 180,302.5 Z"/>
  </g>
  
  <path d="M 45,25 L 155,25 L 160,35 L 155,45 L 45,45 L 40,35 Z" fill="#6b3fa0" opacity="0.15"/>
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="18" fill="#6b3fa0" font-weight="bold">V</text>
  <text x="100" y="58" text-anchor="middle" font-family="serif" font-size="13" fill="#6b3fa0" font-weight="600">THE HIEROPHANT</text>
  
  <g transform="translate(100, 155)">
    <!-- Sacred radiance -->
    <g opacity="0.2" stroke="#d4af37" stroke-width="1.5">
      <line x1="-50" y1="-55" x2="-58" y2="-65"/>
      <line x1="0" y1="-60" x2="0" y2="-70"/>
      <line x1="50" y1="-55" x2="58" y2="-65"/>
      <line x1="-60" y1="-20" x2="-70" y2="-25"/>
      <line x1="60" y1="-20" x2="70" y2="-25"/>
    </g>
    
    <!-- Triple crown -->
    <g transform="translate(0, -60)">
      <path d="M -30,-10 L -25,0 L -15,-5 L 0,5 L 15,-5 L 25,0 L 30,-10 L 30,-15 L -30,-15 Z" 
            fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M -25,0 L -20,10 L -10,5 L 0,15 L 10,5 L 20,10 L 25,0" 
            fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M -20,10 L -15,20 L -5,15 L 0,25 L 5,15 L 15,20 L 20,10" 
            fill="none" stroke="#d4af37" stroke-width="2"/>
      <circle cx="-20" cy="-5" r="3" fill="#d4af37"/>
      <circle cx="0" cy="0" r="3" fill="#d4af37"/>
      <circle cx="20" cy="-5" r="3" fill="#d4af37"/>
    </g>
    
    <!-- Hierophant figure -->
    <g>
      <!-- Head -->
      <circle cx="0" cy="-35" r="11" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="2"/>
      <circle cx="-3" cy="-36" r="1.5" fill="#6b3fa0"/>
      <circle cx="3" cy="-36" r="1.5" fill="#6b3fa0"/>
      <path d="M -2,-32 Q 0,-30 2,-32" stroke="#6b3fa0" stroke-width="1" fill="none"/>
      
      <!-- Red/white robes -->
      <path d="M -18,-24 L -25,20 L -28,50 L 28,50 L 25,20 L 18,-24 Z" 
            fill="#c41e3a" opacity="0.6" stroke="#6b3fa0" stroke-width="2"/>
      <path d="M -14,-24 L 14,-24 L 12,20 L -12,20 Z" fill="#ffffff" opacity="0.4"/>
      
      <!-- Cross embroidery -->
      <g transform="translate(0, -8)" stroke="#d4af37" stroke-width="2">
        <line x1="0" y1="-8" x2="0" y2="8"/>
        <line x1="-6" y1="0" x2="6" y2="0"/>
        <circle cx="0" cy="0" r="4" fill="none" stroke-width="1.5"/>
      </g>
      
      <!-- Right hand blessing gesture -->
      <g transform="translate(20, -15)">
        <line x1="0" y1="0" x2="3" y2="15" stroke="#f4e4bc" stroke-width="3.5"/>
        <circle cx="3" cy="17" r="3" fill="#f4e4bc" stroke="#6b3fa0" stroke-width="1"/>
        <line x1="3" y1="17" x2="1" y2="10" stroke="#f4e4bc" stroke-width="2"/>
        <line x1="3" y1="17" x2="5" y2="10" stroke="#f4e4bc" stroke-width="2"/>
      </g>
      
      <!-- Staff in left hand -->
      <g transform="translate(-22, -15)">
        <line x1="0" y1="0" x2="-3" y2="55" stroke="#d4af37" stroke-width="3"/>
        <path d="M -3,55 L -10,65 L 4,65 L -3,55 Z" fill="#d4af37"/>
        <circle cx="-3" cy="55" r="2" fill="#d4af37"/>
      </g>
    </g>
    
    <!-- Crossed keys -->
    <g transform="translate(0, 35)">
      <!-- Left key (silver) -->
      <g transform="rotate(-35, -15, 0)">
        <circle cx="-15" cy="-5" r="8" fill="none" stroke="#c0c0c0" stroke-width="2.5"/>
        <circle cx="-15" cy="-5" r="4" fill="none" stroke="#c0c0c0" stroke-width="2"/>
        <line x1="-15" y1="3" x2="-15" y2="35" stroke="#c0c0c0" stroke-width="2.5"/>
        <line x1="-15" y1="25" x2="-10" y2="25" stroke="#c0c0c0" stroke-width="2.5"/>
        <line x1="-15" y1="30" x2="-10" y2="30" stroke="#c0c0c0" stroke-width="2.5"/>
      </g>
      
      <!-- Right key (gold) -->
      <g transform="rotate(35, 15, 0)">
        <circle cx="15" cy="-5" r="8" fill="none" stroke="#d4af37" stroke-width="2.5"/>
        <circle cx="15" cy="-5" r="4" fill="none" stroke="#d4af37" stroke-width="2"/>
        <line x1="15" y1="3" x2="15" y2="35" stroke="#d4af37" stroke-width="2.5"/>
        <line x1="15" y1="25" x2="20" y2="25" stroke="#d4af37" stroke-width="2.5"/>
        <line x1="15" y1="30" x2="20" y2="30" stroke="#d4af37" stroke-width="2.5"/>
      </g>
    </g>
    
    <!-- Two acolytes at base -->
    <g transform="translate(-30, 55)">
      <circle cx="0" cy="0" r="7" fill="#6b3fa0" opacity="0.3"/>
      <rect x="-5" y="7" width="10" height="15" fill="#6b3fa0" opacity="0.3"/>
    </g>
    <g transform="translate(30, 55)">
      <circle cx="0" cy="0" r="7" fill="#6b3fa0" opacity="0.3"/>
      <rect x="-5" y="7" width="10" height="15" fill="#6b3fa0" opacity="0.3"/>
    </g>
    
    <!-- Pillars in background -->
    <g opacity="0.25">
      <rect x="-55" y="-40" width="10" height="100" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      <rect x="45" y="-40" width="10" height="100" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    </g>
    
    <!-- Decorative elements -->
    <g fill="#d4af37" opacity="0.5">
      <circle cx="-60" cy="-45" r="2"/>
      <circle cx="60" cy="-45" r="2"/>
    </g>
  </g>
  
  <path d="M 30,285 L 35,280 L 165,280 L 170,285 L 170,295 L 165,300 L 35,300 L 30,295 Z" 
        fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="293" text-anchor="middle" font-family="serif" font-size="10" fill="#6b3fa0" opacity="0.85">
    Tradition · Wisdom · Spiritual Guidance
  </text>
</svg>

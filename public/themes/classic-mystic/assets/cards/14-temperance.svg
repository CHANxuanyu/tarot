  <line x1="67.5" y1="145" x2="67.5" y2="135" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Right chalice -->
  <path d="M 130 155 L 135 155 L 137 175 Q 137 180 132.5 180 Q 128 180 128 175 Z" fill="none" stroke="#d4af37" stroke-width="2.5"/>
  <line x1="125" y1="155" x2="140" y2="155" stroke="#d4af37" stroke-width="2"/>

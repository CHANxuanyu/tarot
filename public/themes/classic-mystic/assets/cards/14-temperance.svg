  <circle cx="100" cy="190" r="3" fill="#6b3fa0" opacity="0.5"/>
  
  <text x="100" y="300" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Balance · Moderation · Patience</text>

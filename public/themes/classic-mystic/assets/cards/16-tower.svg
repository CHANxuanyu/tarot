<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">XVI - THE TOWER</text>
  
  <!-- Tower -->
  <g transform="translate(100, 160)">
    <rect x="-25" y="0" width="50" height="80" fill="none" stroke="#6b3fa0" stroke-width="2.5"/>
    <rect x="-20" y="10" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="5" y="10" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="-20" y="35" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="5" y="35" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="-20" y="60" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="5" y="60" width="15" height="15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    
    <!-- Crown/Top -->
    <path d="M -30,-5 L -25,0 L 25,0 L 30,-5 L 25,-10 L -25,-10 Z" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    
    <!-- Lightning Bolt -->
    <path d="M 0,-50 L -15,-20 L -5,-20 L -20,20 L 5,-5 L -5,-5 Z" 
          fill="#d4af37" stroke="#6b3fa0" stroke-width="2" stroke-linejoin="miter"/>
    
    <!-- Falling debris -->
    <circle cx="-40" cy="-15" r="3" fill="#6b3fa0" opacity="0.6"/>
    <circle cx="45" cy="-10" r="2.5" fill="#6b3fa0" opacity="0.6"/>
    <circle cx="-35" cy="5" r="2" fill="#6b3fa0" opacity="0.6"/>
    <circle cx="40" cy="10" r="2" fill="#6b3fa0" opacity="0.6"/>
  </g>
  
  <text x="100" y="295" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Sudden Change</text>
  <text x="100" y="307" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Upheaval · Revelation</text>
</svg>

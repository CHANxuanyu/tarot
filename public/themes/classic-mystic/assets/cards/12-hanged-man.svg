<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">XII - THE HANGED MAN</text>
  
  <!-- Inverted triangle -->
  <path d="M 100 130 L 70 180 L 130 180 Z" fill="none" stroke="#6b3fa0" stroke-width="2.5"/>
  
  <!-- Hanging figure (simplified) -->
  <circle cx="100" cy="150" r="8" fill="none" stroke="#d4af37" stroke-width="2"/>
  <line x1="100" y1="158" x2="100" y2="175" stroke="#d4af37" stroke-width="2.5"/>
  <line x1="100" y1="165" x2="90" y2="172" stroke="#d4af37" stroke-width="2"/>
  <line x1="100" y1="165" x2="110" y2="172" stroke="#d4af37" stroke-width="2"/>
  <line x1="100" y1="175" x2="95" y2="168" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Connection to triangle top -->
  <line x1="100" y1="130" x2="100" y2="142" stroke="#6b3fa0" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Halo/enlightenment glow -->
  <circle cx="100" cy="150" r="15" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  
  <text x="100" y="300" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Pause · Surrender · New Perspective</text>
</svg>

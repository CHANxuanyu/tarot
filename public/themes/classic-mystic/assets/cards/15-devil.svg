<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4bc"/>
      <stop offset="100%" style="stop-color:#e8d4a0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="320" rx="12" fill="url(#cardBg)" stroke="#d4af37" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="304" rx="8" fill="none" stroke="#6b3fa0" stroke-width="1" opacity="0.4"/>
  <text x="100" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" fill="#6b3fa0" font-weight="bold">XV - THE DEVIL</text>
  
  <!-- Inverted Pentagram -->
  <g transform="translate(100, 150)">
    <polygon points="0,-40 38,14.7 -23.5,-12.4 23.5,-12.4 -38,14.7" 
             fill="none" stroke="#6b3fa0" stroke-width="2.5"/>
    <circle cx="0" cy="-40" r="3" fill="#6b3fa0"/>
    <circle cx="38" cy="14.7" r="3" fill="#6b3fa0"/>
    <circle cx="-23.5" cy="-12.4" r="3" fill="#6b3fa0"/>
    <circle cx="23.5" cy="-12.4" r="3" fill="#6b3fa0"/>
    <circle cx="-38" cy="14.7" r="3" fill="#6b3fa0"/>
    
    <!-- Chains -->
    <g opacity="0.7">
      <path d="M -50,30 L -60,45 M -60,45 L -50,60" stroke="#6b3fa0" stroke-width="2" fill="none"/>
      <ellipse cx="-50" cy="30" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      <ellipse cx="-60" cy="45" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      <ellipse cx="-50" cy="60" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      
      <path d="M 50,30 L 60,45 M 60,45 L 50,60" stroke="#6b3fa0" stroke-width="2" fill="none"/>
      <ellipse cx="50" cy="30" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      <ellipse cx="60" cy="45" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
      <ellipse cx="50" cy="60" rx="6" ry="8" fill="none" stroke="#6b3fa0" stroke-width="2"/>
    </g>
  </g>
  
  <text x="100" y="295" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Shadow Self</text>
  <text x="100" y="307" text-anchor="middle" font-family="'Crimson Pro', serif" font-size="9" fill="#6b3fa0" opacity="0.8">Attachment · Addiction</text>
